name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    
    name: PHP ${{ matrix.php-version }}
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, openssl, soap, dom, simplexml, libxml, zlib, gd, mbstring, curl
          coverage: xdebug
      
      - name: Validar composer.json
        run: composer validate --strict
      
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-
      
      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress
      
      - name: Verificar estilo de código (PHP CS)
        run: composer phpcs
        continue-on-error: true
      
      - name: Análise estática (PHPStan)
        run: composer phpstan
        continue-on-error: true
      
      - name: Executar testes
        run: composer test
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    name: Qualidade de Código
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, soap, dom, simplexml, libxml
      
      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress
      
      - name: PHP CodeSniffer
        run: composer phpcs
        continue-on-error: true
      
      - name: PHPStan
        run: composer phpstan
        continue-on-error: true

